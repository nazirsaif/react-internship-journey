services:
  mongo:
    image: mongo:latest
    container_name: kanban-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: ./Mini-Projects/kanban-api
    container_name: kanban-api
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/kanban
      - PORT=3001
      - JWT_SECRET=supersecretjwtkey
      - JWT_REFRESH_SECRET=supersecretrefreshkey
      - CLIENT_URL=http://localhost:8080
    depends_on:
      - mongo

  client:
    build:
      context: ./Mini-Projects/kanban-board
      args:
        - VITE_API_BASE_URL=http://localhost:3001
    container_name: kanban-client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
