<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Utility Library Pro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="glass-header">
            <h1>JS Utility <span class="gradient-text">Pro</span></h1>
            <p>Premium utilities with zero dependencies.</p>
        </header>

        <section class="demo-section glass-panel">
            <h2>Live API Search <span class="badge">Debounce</span></h2>
            <div class="search-wrapper">
                <input type="text" id="search-input" placeholder="Search for users..."><div id="loading-spinner" class="spinner hidden"></div>
            </div>
            <div id="search-results" class="grid-results"></div>
        </section>
    </div>
    <script src="js/utils.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
