<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5-Day Weather Forecast</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-image: url('/images/2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        header {
            background: #007acc;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        #city-form {
            display: flex;
            justify-content: center;
            margin: 20px;
        }

        #city-input {
            padding: 10px;
            font-size: 16px;
            width: 200px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }

        #city-submit {
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background-color: #007acc;
            color: white;
            cursor: pointer;
        }

        #city-submit:hover {
            background-color: #005fa3;
        }

        #forecast-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .forecast-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 200px;
        }

        .forecast-card img {
            width: 100px;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #f4f4f4;
            margin-top: 20px;
        }

        .back-button-container {
            text-align: center;
            margin-top: 20px;
        }

        .unique-back-button {
            background-color: #ff6f61; /* Unique color */
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px; /* Rounded button */
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .unique-back-button:hover {
            background-color: #ff4c3b; /* Darker shade on hover */
            transform: scale(1.05); /* Slightly enlarge on hover */
        }
    </style>
</head>
<body>
    <header>
        <h1>5-Day Weather Forecast</h1>
    </header>
    <main>
        <form id="city-form">
            <input type="text" id="city-input" placeholder="Enter city name" required>
            <button type="submit" id="city-submit">Get Forecast</button>
        </form>
        <div id="forecast-container">
            <!-- Forecast data will be dynamically populated -->
        </div>
    </main>
    
    <div class="back-button-container">
        <button id="back-home" class="unique-back-button">Back to Homepage</button>
    </div>
    
    <script>
        const apiKey = "0ab13fdbba1599dda116f576fa9511f6"; // Replace with your OpenWeather API key
        const cityForm = document.getElementById("city-form");
        const cityInput = document.getElementById("city-input");
        const forecastContainer = document.getElementById("forecast-container");

        async function fetchForecast(city) {
            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&units=metric&appid=${apiKey}`);
                
                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();
                const dailyForecast = data.list.filter((item) => item.dt_txt.includes("12:00:00"));

                // Clear previous forecast
                forecastContainer.innerHTML = "";

                dailyForecast.forEach((forecast) => {
                    const date = new Date(forecast.dt_txt).toDateString();
                    const temp = forecast.main.temp;
                    const desc = forecast.weather[0].description;
                    const icon = forecast.weather[0].icon;

                    forecastContainer.innerHTML += `
                        <div class="forecast-card">
                            <h3>${date}</h3>
                            <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="${desc}">
                            <p>Temperature: ${temp}°C</p>
                            <p>Condition: ${desc}</p>
                        </div>
                    `;
                });
            } catch (error) {
                forecastContainer.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                console.error(error);
            }
        }

        // Event listener for form submission
        cityForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const city = cityInput.value.trim();
            if (city) {
                fetchForecast(city);
            } else {
                alert("Please enter a valid city name!");
            }
        });

        document.getElementById("back-home").addEventListener("click", () => {
            window.location.href = "homepage.html"; // Change to your homepage URL
        });
    </script>
</body>
</html>
