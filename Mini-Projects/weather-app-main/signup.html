<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('public/images/2.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .signup-form {
            background-color: rgba(0, 0, 0, 0.7); 
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            color: #ffffff; 
        }

        .signup-form h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .signup-form label {
            display: block;
            margin: 10px 0 5px;
            color: #ffffff;
        }

        .password-container {
            position: relative;
            margin-bottom: 15px;
        }

        .signup-form input {
            width: 100%;
            padding: 10px;
            padding-right: 40px; /* Space for the icon */
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .password-container .toggle-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.7;
            font-size: 14px;
            color: #ffffff;
        }

        .password-container .toggle-icon:hover {
            opacity: 1;
        }

        .signup-form button {
            width: 100%;
            padding: 10px;
            background-color: #0073e6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-form button:hover {
            background-color: #005bb5;
        }

        .error {
            color: #ff6666;
            font-size: 14px;
        }

        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .show-password {
            cursor: pointer;
            font-size: 0.9em;
            color: #007acc;
            margin-left: 5px;
        }
    </style>
</head>
<body>
    <div class="signup-form">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <span class="show-password" onclick="togglePasswordVisibility('password')">Show</span>

            <label for="confirm-password">Confirm Password:</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
            <span class="show-password" onclick="togglePasswordVisibility('confirm-password')">Show</span>

            <button type="submit">Sign Up</button>
        </form>
        <div class="error-message" id="error-message"></div>
        <div class="login-section">
            <p>Already have an account? <a href="login.html">Login here</a></p>
        </div>
    </div>
    <script>
        document.getElementById("signupForm").addEventListener("submit", async (event) => {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirm-password").value;
            const errorMessage = document.getElementById("error-message");

            // Input validation
            if (!/^[a-zA-Z]+$/.test(name)) {
                errorMessage.textContent = "Name must contain only letters.";
                return;
            }

            if (!/^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z\d]+$/.test(username)) {
                errorMessage.textContent = "Username must contain both letters and numbers.";
                return;
            }

            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[a-zA-Z\d]+$/.test(password)) {
                errorMessage.textContent = "Password must contain uppercase, lowercase, and numbers.";
                return;
            }

            if (password !== confirmPassword) {
                errorMessage.textContent = "Passwords do not match.";
                return;
            }

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, username, password }),
                });

                if (response.ok) {
                    const data = await response.json();
                    alert(data.message);
                    window.location.href = "login.html"; // Redirect to login page after successful registration
                } else {
                    const data = await response.json();
                    errorMessage.textContent = data.error; // Display error message
                }
            } catch (error) {
                errorMessage.textContent = "An error occurred. Please try again.";
            }
        });

        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            if (field.type === "password") {
                field.type = "text";
            } else {
                field.type = "password";
            }
        }
    </script>
</body>
</html>
