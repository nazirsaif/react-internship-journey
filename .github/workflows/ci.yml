name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  react-ui-system:
    name: React UI System
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Lint
      run: npm run lint --workspace=Mini-Projects/react-ui-system
    - name: Type check
      run: npx tsc --noEmit
      working-directory: Mini-Projects/react-ui-system

  kanban-board:
    name: Kanban Board
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Type check
      run: npx tsc --noEmit
      working-directory: Mini-Projects/kanban-board
    - name: Run Unit Tests
      run: npm run test --workspace=Mini-Projects/kanban-board -- --coverage
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run E2E tests
      run: npm run test:e2e --workspace=Mini-Projects/kanban-board

  kanban-api:
    name: Kanban API
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: npm install
      working-directory: Mini-Projects/kanban-api
    - name: Run Tests
      run: npm test
      working-directory: Mini-Projects/kanban-api

  chat-app:
    name: Chat App
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    
    - name: Install frontend dependencies
      run: npm install
      working-directory: Mini-Projects/chat-app/frontend
    - name: Lint frontend
      run: npm run lint
      working-directory: Mini-Projects/chat-app/frontend
    - name: Type check frontend
      run: npx tsc --noEmit
      working-directory: Mini-Projects/chat-app/frontend
      
    - name: Install backend dependencies
      run: npm install
      working-directory: Mini-Projects/chat-app/backend
    - name: Test backend
      run: npm test
      working-directory: Mini-Projects/chat-app/backend
