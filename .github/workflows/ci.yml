name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run linter for UI System
      run: npm run lint --workspace=Mini-Projects/react-ui-system
      
    - name: Type check for UI System
      run: npm run build --workspace=Mini-Projects/react-ui-system
      
    - name: Build Kanban Board
      run: npm run build --workspace=Mini-Projects/kanban-board

    - name: Run tests with coverage for Kanban Board
      run: npm run test --workspace=Mini-Projects/kanban-board -- --coverage
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: Run E2E tests for Kanban Board
      run: npm run test:e2e --workspace=Mini-Projects/kanban-board
